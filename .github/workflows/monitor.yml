name: ReqRes API Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Create Monitor Collection
        run: |
          cat > monitor_collection.json <<'EOF'
          {
            "info": {
              "name": "ReqRes API Monitor",
              "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
            },
            "item": [
              {
                "name": "GET Users Availability",
                "request": {
                  "method": "GET",
                  "header": [
                    {
                      "key": "x-api-key",
                      "value": "{{api-key}}"
                    }
                  ],
                  "url": "https://reqres.in/api/users?page=1"
                },
                "event": [
                  {
                    "listen": "test",
                    "script": {
                      "exec": [
                        "pm.test('Status code is 200', function () {",
                        "    pm.response.to.have.status(200);",
                        "});",
                        "pm.test('Response time below 800ms', function () {",
                        "    pm.expect(pm.response.responseTime).to.be.below(800);",
                        "});"
                      ],
                      "type": "text/javascript"
                    }
                  }
                ]
              }
            ]
          }
          EOF

      - name: Run API Monitor
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          newman run monitor_collection.json \
            --env-var "api-key=$REQRES_API_KEY"
